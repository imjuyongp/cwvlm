[project]
name = "cwvlm"
version = "0.1.0"
description = "창원시 노인 보행환경 위험도 분석 — 로드뷰 VLM 피쳐 + 공공데이터 규칙 채점"
requires-python = ">=3.10"
dependencies = [
    "openai",          # OpenRouter API (VLM 피쳐 추출, 현장확인사항 서술)
]

[project.optional-dependencies]
local = ["ollama"]     # --backend ollama 로 로컬 실행할 때만 필요

[tool.setuptools.packages.find]
include = ["cwvlm*"]
